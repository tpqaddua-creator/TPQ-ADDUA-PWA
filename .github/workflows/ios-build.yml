name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd src
          pod install

      - name: Build iOS
        run: |
          cd src
          xcodebuild \
            -workspace "TPQ AD-DU'A.xcworkspace" \
            -scheme "TPQ AD-DU'A" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/TPQADDUA.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "TPQADDUA.xcarchive/Products/Applications/"*.app Payload/
          zip -r "TPQ-ADDUA-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TPQ-ADDUA-iOS
          path: TPQ-ADDUA-unsigned.ipa
